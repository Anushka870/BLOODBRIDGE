rsor.execute('''","            INSERT INTO requests (patient, hospital, phone, bg, city, pin, liters, urgency, status, created_at, expires_at)","            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, 'open', %s, %s)","        ''', (data['patient'], data['hospital'], data['phone'], data['bg'], data['city'], data['pin'], data['liters'], data['urgency'], data['createdAt'], data['expiresAt']))","        conn.commit()","        cursor.close()","        conn.close()","        return jsonify({\"success\": True})","    except Exception as e:","        return jsonify({\"success\": False, \"message\": str(e)}), 400","","@app.route(\"/api/profile/\u003cphone\u003e\", methods=[\"GET\"])","def get_profile(phone):","    try:","        conn = get_db_connection()","        cursor = conn.cursor(dictionary=True)","        ","        cursor.execute(\"SELECT * FROM donors WHERE phone = %s\", (phone,))","        donor = cursor.fetchone()","        if donor:","            cursor.close()","            conn.close()","            return jsonify({\"role\": \"donor\", \"user\": donor})","","        cursor.execute(\"SELECT * FROM blood_banks WHERE phone = %s\", (phone,))","        bank = cursor.fetchone()","        if bank:","            stock = {","                \"A+\": bank[\"a_pos\"], \"A-\": bank[\"a_neg\"], \"B+\": bank[\"b_pos\"], \"B-\": bank[\"b_neg\"],","                \"AB+\": bank[\"ab_pos\"], \"AB-\": bank[\"ab_neg\"], \"O+\": bank[\"o_pos\"], \"O-\": bank[\"o_neg\"]","            }","            bank[\"stock\"] = stock","            cursor.close()","            conn.close()","            return jsonify({\"role\": \"bank\", \"user\": bank})","","        cursor.execute(\"SELECT * FROM requests WHERE phone = %s\", (phone,))","        requests_data = cursor.fetchall()","        if requests_data:","            cursor.close()","            conn.close()","            return jsonify({\"role\": \"receiver\", \"requests\": requests_data})","","        cursor.close()","        conn.close()",